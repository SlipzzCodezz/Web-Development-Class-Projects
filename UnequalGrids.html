<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Unequal Grid</title>

    <!-- Include Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .col-md-3,
        .col-md-6 {

            background-color: #f2f2f2;

            border: 1px solid #ddd;

            padding: 20px;

            text-align: center;

        }
    </style>

</head>

<body>

    <div class="container mt-4">

        <h3>Unequal Columns</h3>

        <div class="row">

            <div class="col-md-3">

                Column 1 (col-md-3)

            </div>

            <div class="col-md-6">

                Column 2 (col-md-6)

            </div>

            <div class="col-md-3">

                Column 3 (col-md-3)

            </div>

        </div>

    </div>

</body>

</html>
