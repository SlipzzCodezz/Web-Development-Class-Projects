<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Layout</title>

    <style>
        .grid-container {

            display: grid;

            grid-template-columns: auto auto auto;

            grid-template-areas:

                'header header header'

                'menu main main'

                'menu footer footer';

            background-color: rgb(183, 192, 187);

            padding: 10px;

            height: 500px;

        }

        div.grid-container>div {

            background-color: #2f5a8c;

            border: 1px solid #000;

            padding: 20px;

            text-align: center;

        }

        .grid-item1 {

            grid-area: header;

        }

        .grid-item2 {

            grid-area: menu;

        }

        .grid-item3 {

            grid-area: main;

        }

        .grid-item4 {

            grid-area: footer;

        }
    </style>

</head>

<body>

    <div class="grid-container">

        <div class="grid-item1">Header</div>

        <div class="grid-item2">Menu</div>

        <div class="grid-item3">Main</div>

        <div class="grid-item4">Footer

        </div>

</body>

</html>
