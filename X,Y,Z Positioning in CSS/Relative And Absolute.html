<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        div.relative {

            position: relative;

            left: 100px;

            border: 3px solid rgb(10, 43, 255);

        }

        div.absolute {

            position: absolute;

            left: 50px;

            border: 3px solid rgb(243, 19, 19);

        }
    </style>

</head>

<body>

    <div class="relative"> Relative Positioning

        <div class="absolute">Absolute Positiioning</div>

    </div>


</body>

</html>
