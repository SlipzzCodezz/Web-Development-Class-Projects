<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opcacity</title>

    <style>
        div {

            background-color: #ec4edd;

            padding: 10px;

        }

        div.first {

            opacity: 0.1;

        }

        div.second {

            opacity: 0.2;

        }

        div.third {

            opacity: 0.3;

        }

        div.four {

            opacity: 0.4;

        }

        div.default {

            opacity: 1;

        }
    </style>

</head>

<body>

    <div class="first">Opacity 0.1</div>

    <div class="second">Opacity 0.2</div>

    <div class="third">Opacity 0.3</div>

    <div class="four">Opacity 0.4</div>


    <div class="default">Opacity 1</div>


</body>

</html>
