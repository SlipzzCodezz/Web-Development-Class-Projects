<!DOCTYPE html>

<html>

<head>

    <style>
        .flex-container {

            display: flex;

            flex-direction: row;

            justify-content: space-around;

            height: 200px;

            align-items: center;

            background-color: rgb(51, 235, 232);

        }

        .flex-container>div {

            background-color: #ffffff;

            width: 100px;

            margin: 10px;

            text-align: center;

            line-height: 75px;

            font-size: 30px;

        }
    </style>

</head>

<body>

    <h1>The align-items Property</h1>

    <p>align-items: center; aligns the flex items in the middle of the container:</p>

    <div class="flex-container">

        <div>1</div>

        <div>2</div>

        <div>3</div>

    </div>

</body>

</html>
